<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>🎰 Рулетка Звезд</h1>
    <button class="btn" onclick="payInBot(5)">Крутить за 5 ⭐ (Переход в бот)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function payInBot(starsCount) {
            try {
                const response = await fetch('/api/create-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stars: starsCount })
                });

                const data = await response.json();

                if (response.ok && data.invoice_url) {
                    // Перенаправляем пользователя к счёту в чат и закрываем Mini App
                    tg.openTelegramLink(data.invoice_url);
                    tg.close();
                } else {
                    alert('Ошибка: ' + JSON.stringify(data));
                }
            } catch (e) {
                alert('Ошибка сети: ' + e.message);
            }
        }
    </script>
</body>
</html>
