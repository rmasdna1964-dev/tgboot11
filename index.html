<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Auth Form</title>

    <!-- Подключаем SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            width: 100%;
            overflow: hidden;
        }

        .ring {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring i {
            position: absolute;
            inset: 0;
            border: 2px solid #fff;
            transition: 0.5s;
        }

        .ring i:nth-child(1) {
            border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
            animation: animate 6s linear infinite;
            --clr: #ff0000;
        }

        .ring i:nth-child(2) {
            border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%;
            animation: animate 4s linear infinite;
            --clr: #ff3333;
        }

        .ring i:nth-child(3) {
            border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%;
            animation: animate2 10s linear infinite;
            --clr: #cc0000;
        }

        .ring:hover i {
            border: 6px solid var(--clr);
            filter: drop-shadow(0 0 20px var(--clr));
        }

        @keyframes animate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes animate2 {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .form-box {
            position: absolute;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            transition: 0.3s ease;
        }

        .form-box.hidden {
            display: none;
        }

        .form-box h2 {
            font-size: 1.8em;
            color: #fff;
            text-align: center;
        }

        .form-box .inputBx {
            position: relative;
            width: 100%;
        }

        .form-box .inputBx input {
            position: relative;
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #fff;
            border-radius: 40px;
            font-size: 1em;
            color: #fff;
            box-shadow: none;
            outline: none;
        }

        .form-box .inputBx input.code-input {
            text-align: center;
            letter-spacing: 6px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .form-box .inputBx input[type="submit"],
        .form-box .inputBx input[type="button"] {
            width: 100%;
            background: linear-gradient(45deg, #ff0000, #ff5555);
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
            transition: 0.3s ease;
        }

        .form-box .inputBx input[type="submit"]:hover,
        .form-box .inputBx input[type="button"]:hover {
            box-shadow: 0 0 10px #ff0000;
        }

        .form-box .inputBx input::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }

        .form-box .links {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .form-box .links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.85em;
            cursor: pointer;
        }

        .form-box .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="ring">
        <i></i>
        <i></i>
        <i></i>

        <!-- 1. Вход (Login) -->
        <div class="form-box" id="loginForm">
            <h2>Login</h2>
            <div class="inputBx">
                <input type="text" placeholder="Username">
            </div>
            <div class="inputBx">
                <input type="password" placeholder="Password">
            </div>
            <div class="inputBx">
                <input type="submit" value="Sign in">
            </div>
            <div class="links">
                <a onclick="showForm('forgotForm')">Forgot Password?</a>
                <a onclick="showForm('signupForm')">Signup</a>
            </div>
        </div>

        <!-- 2. Регистрация (Signup) -->
        <div class="form-box hidden" id="signupForm">
            <h2>Signup</h2>
            <div class="inputBx">
                <input type="text" placeholder="Username">
            </div>
            <div class="inputBx">
                <input type="email" id="signupEmail" placeholder="Email">
            </div>
            <div class="inputBx">
                <input type="password" placeholder="Password">
            </div>
            <div class="inputBx">
                <input type="button" onclick="sendEmailCode()" value="Register">
            </div>
            <div class="links">
                <a onclick="showForm('loginForm')">Already have an account?</a>
            </div>
        </div>

        <!-- 3. Подтверждение кода (Verify Code) -->
        <div class="form-box hidden" id="verifyForm">
            <h2>Verify Code</h2>
            <div class="inputBx">
                <input type="text" id="userInputCode" class="code-input" maxlength="6" placeholder="000000">
            </div>
            <div class="inputBx">
                <input type="button" onclick="verifyCode()" value="Confirm Code">
            </div>
            <div class="links">
                <a onclick="showForm('signupForm')">Back</a>
                <a onclick="sendEmailCode()">Resend Code</a>
            </div>
        </div>

        <!-- 4. Восстановление пароля (Forgot Password) -->
        <div class="form-box hidden" id="forgotForm">
            <h2>Reset Password</h2>
            <div class="inputBx">
                <input type="email" placeholder="Enter your Email">
            </div>
            <div class="inputBx">
                <input type="submit" value="Reset Link">
            </div>
            <div class="links">
                <a onclick="showForm('loginForm')">Back to Login</a>
                <a onclick="showForm('signupForm')">Signup</a>
            </div>
        </div>
    </div>

    <script>
        // === НАСТРОЙКИ EMAILJS ===
        const PUBLIC_KEY = "kwsqpDBiYJr2qkR5"; 
        const SERVICE_ID = "service_rhbqk7g"; 
        const TEMPLATE_ID = "template_e49yl9g";

        // Инициализация
        emailjs.init(PUBLIC_KEY);

        let generatedCode = null;

        // Переключение вкладок
        function showForm(formId) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('verifyForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById(formId).classList.remove('hidden');
        }

        // Отправка кода
        function sendEmailCode() {
            const email = document.getElementById('signupEmail').value;
            if (!email) {
                alert('Пожалуйста, введите Email!');
                return;
            }

            // Генерируем 6-значный код
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            // Передаем параметры
            const templateParams = {
                to_email: email,
                code: generatedCode
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then((response) => {
                    console.log('Успешно отправлено:', response.status, response.text);
                    alert('Код отправлен на ваш Email!');
                    showForm('verifyForm');
                })
                .catch((error) => {
                    console.error('Ошибка отправки:', error);
                    alert('Ошибка отправки. Проверьте консоль (F12) для деталей.');
                });
        }

        // Проверка кода
        function verifyCode() {
            const inputVal = document.getElementById('userInputCode').value;

            if (inputVal === generatedCode) {
                alert('Успешно! Аккаунт подтвержден.');
                showForm('loginForm');
            } else {
                alert('Неверный код! Попробуйте еще раз.');
            }
        }
    </script>
</body>
</html>
