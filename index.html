<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест EmailJS</title>
    <!-- Подключаем EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff0000;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }
        input {
            padding: 10px;
            background: transparent;
            border: 1px solid #fff;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 1em;
        }
        button {
            padding: 10px;
            background: #ff0000;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #ff3333;
            box-shadow: 0 0 10px #ff0000;
        }
        #status {
            font-size: 0.9em;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Тест отправки кода</h2>
        <form id="testForm" onsubmit="sendTestEmail(event)">
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="email" id="testEmail" name="to_email" placeholder="Введите ваш Email" required>
                <!-- Скрытые поля для шаблона -->
                <input type="hidden" name="email" id="hiddenEmail">
                <input type="hidden" name="code" id="hiddenCode">
                <button type="submit" id="sendBtn">Отправить тестовый код</button>
            </div>
        </form>
        <div id="status"></div>
    </div>

    <script>
        // Ваши актуальные данные
        const PUBLIC_KEY = "VLB99SaFJm5uLfqjB";
        const SERVICE_ID = "service_gebo16s";
        const TEMPLATE_ID = "template_osjbntn";

        emailjs.init(PUBLIC_KEY);

        function sendTestEmail(e) {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            const emailVal = document.getElementById('testEmail').value.trim();
            const btn = document.getElementById('sendBtn');

            // Генерируем случайный 6-значный код
            const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            // Заполняем скрытые поля, которые подставятся в шаблон письма
            document.getElementById('hiddenEmail').value = emailVal;
            document.getElementById('hiddenCode').value = randomCode;

            statusEl.style.color = '#ffcc00';
            statusEl.innerText = 'Отправка...';
            btn.disabled = true;

            const formElement = document.getElementById('testForm');

            emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, formElement)
                .then((response) => {
                    console.log('SUCCESS!', response.status, response.text);
                    statusEl.style.color = '#00ff64';
                    statusEl.innerText = `Успешно! Код ${randomCode} отправлен. Проверьте почту.`;
                    btn.disabled = false;
                })
                .catch((error) => {
                    console.error('FAILED...', error);
                    statusEl.style.color = '#ff3333';
                    statusEl.innerText = 'Ошибка: ' + JSON.stringify(error);
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
