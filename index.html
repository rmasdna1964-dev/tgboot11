<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberAuth App</title>

    <!-- Подключаем EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .ring {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .ring.hidden {
            display: none !important;
        }

        .ring i {
            position: absolute;
            inset: 0;
            border: 4px solid var(--clr);
            filter: drop-shadow(0 0 15px var(--clr));
            transition: 0.5s;
        }

        .ring i:nth-child(1) {
            border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
            animation: animate 6s linear infinite;
            --clr: #ff0000;
        }

        .ring i:nth-child(2) {
            border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%;
            animation: animate 4s linear infinite;
            --clr: #ff3333;
        }

        .ring i:nth-child(3) {
            border-radius: 41% 44% 56% 59% / 38% 62% 63% 37%;
            animation: animate2 10s linear infinite;
            --clr: #cc0000;
        }

        @keyframes animate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes animate2 {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Общий стиль для всех модальных блоков авторизации */
        .form-box {
            position: absolute;
            width: 350px;
            background: rgba(17, 17, 17, 0.85);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            color: #fff;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        /* Жесткое скрытие элементов */
        .form-box.hidden, div.hidden {
            display: none !important;
        }

        .form-box h2 {
            font-size: 1.8em;
            color: #fff;
            text-align: center;
            margin-bottom: 5px;
        }

        .form-box .inputBx {
            position: relative;
            width: 100%;
        }

        .form-box .inputBx input {
            position: relative;
            width: 100%;
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #fff;
            border-radius: 40px;
            font-size: 1em;
            color: #fff;
            outline: none;
        }

        .form-box .inputBx input::placeholder {
            color: #aaa;
        }

        .form-box .inputBx input.code-input {
            text-align: center;
            letter-spacing: 6px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .form-box .inputBx input[type="submit"],
        .form-box .inputBx input[type="button"],
        .btn-download,
        .btn-logout {
            width: 100%;
            background: linear-gradient(45deg, #ff0000, #ff5555);
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
            transition: 0.3s ease;
            font-size: 1em;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .form-box .inputBx input[type="submit"]:hover,
        .form-box .inputBx input[type="button"]:hover,
        .btn-download:hover,
        .btn-logout:hover {
            box-shadow: 0 0 15px #ff0000;
            transform: scale(1.02);
        }

        .btn-logout {
            background: #333;
            border: 1px solid #555;
            margin-top: 10px;
        }
        
        .btn-logout:hover {
            background: #444;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .form-box .links {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            margin-top: 5px;
        }

        .form-box .links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.85em;
            cursor: pointer;
        }

        .form-box .links a:hover {
            text-decoration: underline;
            color: #ff5555;
        }

        .status-msg {
            color: #00ff64;
            font-size: 0.85em;
            text-align: center;
            text-shadow: 0 0 8px rgba(0, 255, 100, 0.6);
            display: none;
            line-height: 1.3;
        }

        .status-msg.error {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        /* --- ЛИЧНЫЙ КАБИНЕТ (БЕЗ ВКЛАДОК) --- */
        #dashboardForm {
            position: absolute;
            width: 380px;
            background: #181818;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            color: #fff;
            text-align: center;
        }

        #dashboardForm.hidden {
            display: none !important;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            background: #222;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            margin-bottom: 5px;
        }

        .status-badge {
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid #00ff64;
            color: #00ff64;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-bottom: 5px;
        }

        .user-email {
            font-size: 0.85em;
            color: #aaa;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .downloads-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="ring" id="neonRing">
        <i></i>
        <i></i>
        <i></i>
    </div>

    <!-- 1. Форма Входа -->
    <div class="form-box" id="loginForm">
        <h2>Вход</h2>
        <p class="status-msg error" id="loginError" style="display: none; font-size: 0.8em;">Аккаунт не найден! Зарегистрируйтесь.</p>
        <div class="inputBx">
            <input type="text" id="loginUser" placeholder="Имя пользователя">
        </div>
        <div class="inputBx">
            <input type="password" id="loginPass" placeholder="Пароль">
        </div>
        <div class="inputBx">
            <input type="button" onclick="loginDirectly()" value="Войти">
        </div>
        <div class="links">
            <a onclick="showForm('forgotForm')">Забыли пароль?</a>
            <a onclick="showForm('signupForm')">Регистрация</a>
        </div>
    </div>

    <!-- 2. Форма Регистрации -->
    <form class="form-box hidden" id="signupForm" onsubmit="sendEmailCode(event, 'signup')">
        <h2>Регистрация</h2>
        <div class="inputBx">
            <input type="text" id="signupUser" placeholder="Имя пользователя" required>
        </div>
        <div class="inputBx">
            <input type="email" id="signupEmail" placeholder="Email" required>
        </div>
        <div class="inputBx">
            <input type="password" id="signupPass" placeholder="Пароль" required>
        </div>
        <div class="inputBx">
            <input type="submit" value="Зарегистрироваться">
        </div>
        <div class="links">
            <a onclick="showForm('loginForm')">Уже есть аккаунт?</a>
        </div>
    </form>

    <!-- 3. Форма Подтверждения по Email -->
    <div class="form-box hidden" id="verifyForm">
        <h2>Подтверждение</h2>
        <p class="status-msg" id="verifyStatus">Код успешно отправлен</p>
        <div class="inputBx">
            <input type="text" id="userInputCode" class="code-input" maxlength="6" placeholder="000000">
        </div>
        <div class="inputBx" id="newPasswordWrapper" style="display:none; margin-top: 10px;">
            <input type="password" id="newPasswordInput" placeholder="Новый пароль">
        </div>
        <div class="inputBx" style="margin-top: 10px;">
            <input type="button" onclick="verifyCode()" value="Подтвердить">
        </div>
        <div class="links">
            <a onclick="showForm('loginForm')">Отмена</a>
        </div>
    </div>

    <!-- 4. Форма Сброса пароля -->
    <form class="form-box hidden" id="forgotForm" onsubmit="sendEmailCode(event, 'forgot')">
        <h2>Сброс пароля</h2>
        <div class="inputBx">
            <input type="email" id="forgotEmail" placeholder="Введите ваш Email" required>
        </div>
        <div class="inputBx">
            <input type="submit" value="Отправить код">
        </div>
        <div class="links">
            <a onclick="showForm('loginForm')">Войти</a>
        </div>
    </form>

    <!-- 5. Личный кабинет (Только Профиль и Скачивание) -->
    <div class="hidden" id="dashboardForm">
        <div class="avatar">👤</div>
        <h2 id="displayUsername" style="font-size: 1.4em;">User</h2>
        <div class="status-badge">● VERIFIED</div>
        <p class="user-email" id="displayEmail">email@example.com</p>
        
        <div class="downloads-container">
            <button class="btn-download" onclick="downloadFile('exe')">💻 Скачать для Windows (.exe)</button>
            <button class="btn-download" onclick="downloadFile('apk')">📱 Скачать для Android (.apk)</button>
        </div>

        <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>
    </div>

    <script>
        const PUBLIC_KEY = "VLB99SaFJm5uLfqjB";
        const SERVICE_ID = "service_gebo16s";
        const TEMPLATE_ID = "template_hy4jxdg";

        emailjs.init(PUBLIC_KEY);

        let generatedCode = null;
        let currentUser = { name: '', email: '', password: '' };
        let flowType = 'signup';

        function showForm(formId) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('verifyForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('dashboardForm').classList.add('hidden');
            
            document.getElementById('neonRing').classList.remove('hidden');
            document.getElementById(formId).classList.remove('hidden');
        }

        function sendEmailCode(e, type) {
            if (e) e.preventDefault();
            flowType = type;

            let email = '';

            if (flowType === 'signup') {
                currentUser.name = document.getElementById('signupUser').value.trim() || 'Пользователь';
                currentUser.password = document.getElementById('signupPass').value.trim();
                email = document.getElementById('signupEmail').value.trim();
                currentUser.email = email;
            } else {
                email = document.getElementById('forgotEmail').value.trim();
                currentUser.email = email;
            }

            if (!email) return;

            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

            if (flowType === 'forgot') {
                document.getElementById('newPasswordWrapper').style.display = 'block';
            } else {
                document.getElementById('newPasswordWrapper').style.display = 'none';
            }

            const templateParams = {
                to_email: email,
                email: email,
                code: generatedCode,
                title: (flowType === 'signup') ? 'Код подтверждения регистрации' : 'Сброс и восстановление пароля',
                name: currentUser.name
            };

            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(() => {
                    const statusText = document.getElementById('verifyStatus');
                    statusText.innerText = `Код отправлен на ${email}`;
                    statusText.classList.remove('error');
                    statusText.style.display = 'block';
                    showForm('verifyForm');
                })
                .catch((error) => {
                    console.error('Ошибка EmailJS:', error);
                    const statusText = document.getElementById('verifyStatus');
                    statusText.innerText = 'Ошибка отправки кода';
                    statusText.classList.add('error');
                    statusText.style.display = 'block';
                    showForm('verifyForm');
                });
        }

        function verifyCode() {
            const inputVal = document.getElementById('userInputCode').value.trim();
            const statusText = document.getElementById('verifyStatus');

            if (inputVal === generatedCode) {
                if (flowType === 'forgot') {
                    const newPass = document.getElementById('newPasswordInput').value.trim();
                    if (!newPass) {
                        statusText.innerText = 'Введите новый пароль!';
                        statusText.classList.add('error');
                        statusText.style.display = 'block';
                        return;
                    }
                    currentUser.password = newPass;
                    alert('Пароль успешно изменен!');
                    showForm('loginForm');
                } else {
                    localStorage.setItem('registeredUser', JSON.stringify(currentUser));
                    openDashboard(currentUser.name, currentUser.email);
                }
            } else {
                statusText.innerText = 'Неверный код!';
                statusText.classList.add('error');
                statusText.style.display = 'block';
            }
        }

        function loginDirectly() {
            const usernameInput = document.getElementById('loginUser').value.trim();
            const passwordInput = document.getElementById('loginPass').value.trim();
            const errorMsg = document.getElementById('loginError');

            const savedUser = JSON.parse(localStorage.getItem('registeredUser'));

            if (!savedUser) {
                errorMsg.innerText = 'Аккаунт не найден! Зарегистрируйтесь.';
                errorMsg.style.display = 'block';
                return;
            }

            if (usernameInput === savedUser.name && passwordInput === savedUser.password) {
                errorMsg.style.display = 'none';
                openDashboard(savedUser.name, savedUser.email);
            } else {
                errorMsg.innerText = 'Неверное имя пользователя или пароль!';
                errorMsg.style.display = 'block';
            }
        }

        function openDashboard(name, email) {
            document.getElementById('displayUsername').innerText = name;
            document.getElementById('displayEmail').innerText = email;
            
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('verifyForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            
            document.getElementById('neonRing').classList.add('hidden');
            document.getElementById('dashboardForm').classList.remove('hidden');
        }

        // Функция симуляции скачивания файлов
        function downloadFile(type) {
            const fileName = type === 'exe' ? 'CyberAuth-Setup.exe' : 'CyberAuth-Mobile.apk';
            const fileContent = type === 'exe' 
                ? 'Mock binary data for Windows Executable (.exe)' 
                : 'Mock binary data for Android Package (.apk)';
            
            const blob = new Blob([fileContent], { type: 'application/octet-stream' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function logout() {
            document.getElementById('userInputCode').value = '';
            document.getElementById('verifyStatus').style.display = 'none';
            showForm('loginForm');
        }
    </script>
</body>
</html>
