<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Бесплатные Робуксы</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom card glassmorphism shadow and glow effects */
        .prank-card {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-[#f5f7fa] min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-[440px] bg-white rounded-2xl prank-card border border-gray-100 overflow-hidden transition-all duration-300 transform scale-95 opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]">
        
        <!-- Header Banner -->
        <div class="bg-[#f8f9fc] border-b border-gray-100 p-4 sm:p-5 flex items-center space-x-4">
            <!-- Avatar / Icon -->
            <div class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-xl overflow-hidden shadow-inner bg-indigo-50 flex-shrink-0 border border-indigo-100">
                <img src="https://i.pinimg.com/originals/e2/6a/22/e26a22dd86c7dd0808c819344c1132a0.jpg" 
                     alt="Roblox Avatar" 
                     onerror="this.src='https://placehold.co/100x100/6366f1/ffffff?text=RBX'"
                     class="w-full h-full object-cover">
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-extrabold text-[#1e1b4b] tracking-tight">Бесплатные Робуксы</h1>
                <p class="text-xs sm:text-sm font-bold text-[#6366f1] mt-0.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt text-amber-400"></i> Официальная раздача 2026
                </p>
            </div>
        </div>

        <!-- Body Content -->
        <div class="p-5 sm:p-6 space-y-5">
            
            <!-- Warning / Greeting Banner -->
            <div class="bg-[#fffbeb] border border-amber-200/60 rounded-xl p-3.5 text-xs sm:text-sm text-amber-900/80 leading-relaxed shadow-sm flex items-start space-x-3">
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-lg mt-0.5 flex-shrink-0"></i>
                <p>Привет! Хочешь много робуксов? Возьми родительскую карту и введи её данные ниже для зачисления.</p>
            </div>

            <!-- Form Container -->
            <form id="prankForm" class="space-y-4" onsubmit="event.preventDefault(); handleSubmit();">
                
                <!-- Card Number Input -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-extrabold tracking-wider text-gray-400 uppercase">
                        Номер карты (16 цифр)
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-regular fa-credit-card"></i>
                        </span>
                        <input type="text" 
                               id="cardNumber" 
                               maxlength="19" 
                               placeholder="0000 0000 0000 0000"
                               class="w-full pl-10 pr-4 py-3 bg-[#f9fafb] border border-gray-200 rounded-xl text-sm font-bold text-gray-800 placeholder-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                    </div>
                </div>

                <!-- Row for Valid Thru and CVV -->
                <div class="grid grid-cols-2 gap-3">
                    
                    <!-- Valid Thru -->
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-extrabold tracking-wider text-gray-400 uppercase">
                            Valid Thru
                        </label>
                        <div class="flex items-center space-x-2">
                            <input type="text" 
                                   id="cardMonth" 
                                   maxlength="2" 
                                   placeholder="MM"
                                   class="w-full py-3 px-2 bg-[#f9fafb] border border-gray-200 rounded-xl text-center text-sm font-bold text-gray-800 placeholder-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                            <span class="text-gray-300 font-bold">/</span>
                            <input type="text" 
                                   id="cardYear" 
                                   maxlength="2" 
                                   placeholder="ГГ"
                                   class="w-full py-3 px-2 bg-[#f9fafb] border border-gray-200 rounded-xl text-center text-sm font-bold text-gray-800 placeholder-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                        </div>
                    </div>

                    <!-- CVV -->
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-extrabold tracking-wider text-gray-400 uppercase flex items-center justify-between">
                            <span>CVV код</span>
                            <i class="fa-solid fa-circle-question text-gray-300 hover:text-gray-400 cursor-pointer" title="3 цифры с обратной стороны карты"></i>
                        </label>
                        <div class="relative">
                            <input type="password" 
                                   id="cardCvv" 
                                   maxlength="3" 
                                   placeholder="•••"
                                   class="w-full py-3 px-4 bg-[#f9fafb] border border-gray-200 rounded-xl text-center text-sm font-bold text-gray-800 placeholder-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all tracking-widest">
                        </div>
                    </div>

                </div>

                <!-- Submit Button -->
                <button type="submit" 
                        class="w-full mt-2 py-3.5 px-6 bg-[#6366f1] hover:bg-[#4f46e5] active:scale-[0.98] text-white font-extrabold text-sm rounded-xl shadow-lg shadow-indigo-500/25 transition-all duration-200 flex items-center justify-center space-x-2 cursor-pointer">
                    <span>ПОЛУЧИТЬ РОБУКСЫ</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

            </form>

        </div>
        
        <!-- Footer security note -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-100 flex items-center justify-center space-x-2 text-[11px] text-gray-400 font-medium">
            <i class="fa-solid fa-shield-halved text-emerald-500"></i>
            <span>Безопасное соединение 256-bit SSL</span>
        </div>

    </div>

    <div id="customModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div id="modalContent" class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl transform scale-90 transition-all duration-300 border border-gray-100 space-y-4 text-center">
            
            <!-- Modal Icon Badge -->
            <div id="modalIconContainer" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl">
                <!-- Will be dynamically set via JS -->
            </div>

            <!-- Modal Title -->
            <h3 id="modalTitle" class="text-lg font-extrabold text-gray-900">Заголовок</h3>

            <!-- Modal Description -->
            <p id="modalDesc" class="text-sm text-gray-600 leading-relaxed"></p>

            <!-- Modal Action Button -->
            <button onclick="closeModal()" 
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm rounded-xl shadow-md transition-all cursor-pointer">
                Понятно
            </button>

        </div>
    </div>

    <script>
        // Keyframe animation injected for entrance
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95) translateY(10px); }
                to { opacity: 1; transform: scale(1) translateY(0); }
            }
        `;
        document.head.appendChild(styleSheet);

        // Input element references
        const cardInput = document.getElementById('cardNumber');
        const monthInput = document.getElementById('cardMonth');
        const yearInput = document.getElementById('cardYear');
        const cvvInput = document.getElementById('cardCvv');

        // Restrict input to digits only and auto-format card number with spaces
        cardInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 16) val = val.slice(0, 16);
            // Group by 4 digits
            let formatted = '';
            for (let i = 0; i < val.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += val[i];
            }
            e.target.value = formatted;
        });

        monthInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(0, 2);
            // Validate month range 01-12 optionally, keep simple digit limit here
            e.target.value = val;
        });

        yearInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(0, 2);
            e.target.value = val;
        });

        cvvInput.addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 3) val = val.slice(0, 3);
            e.target.value = val;
        });

        // Modal handling functions
        const modal = document.getElementById('customModal');
        const modalCnt = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalIconContainer = document.getElementById('modalIconContainer');

        function showModal(title, text, type = 'error') {
            modalTitle.innerText = title;
            modalDesc.innerText = text;

            if (type === 'error') {
                modalIconContainer.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl bg-rose-50 text-rose-500";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            } else {
                modalIconContainer.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-2xl bg-amber-50 text-amber-500 animate-bounce";
                modalIconContainer.innerHTML = '<i class="fa-solid fa-face-laugh-squint"></i>';
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCnt.classList.remove('scale-90');
            modalCnt.classList.add('scale-100');
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCnt.classList.remove('scale-100');
            modalCnt.classList.add('scale-90');
        }

        // Close modal when clicking outside content backdrop
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Form validation and submission handler
        function handleSubmit() {
            const rawCard = cardInput.value.replace(/\s/g, '');
            const mm = monthInput.value.trim();
            const yy = yearInput.value.trim();
            const cvv = cvvInput.value.trim();

            if (rawCard.length < 16) {
                showModal("Ошибка заполнения", "Номер карты должен содержать ровно 16 цифр!", "error");
                return;
            }

            if (mm.length < 2 || yy.length < 2) {
                showModal("Ошибка заполнения", "Укажите корректный месяц и год (по 2 цифры)!", "error");
                return;
            }

            if (cvv.length < 3) {
                showModal("Ошибка заполнения", "CVV код должен состоять из 3 цифр!", "error");
                return;
            }

            // Prank Success Modal
            showModal(
                "Розыгрыш!", 
                "Ха-ха! Все твои данные у меня...\nШутка! :) Ни в коем случае не вводи реальные данные банковских карт на подозрительных сайтах в интернете!", 
                "success"
            );
        }
    </script>

</body>
</html>
